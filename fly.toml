# Fly.io app names are globally unique — pick your own
app = "my-hermes"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  HERMES_HOME = "/opt/data"

# No [http_service] by default — Telegram, Discord, Slack, WhatsApp, and
# Signal are all outbound-only (long-poll or websocket out to the platform),
# so the machine doesn't need a public IP. If you want to receive inbound
# webhooks (GitHub, Stripe, etc.) or run Telegram in webhook mode, uncomment
# the block below and add the WEBHOOK_HOST / WEBHOOK_PORT env vars above.
#
# [http_service]
#   internal_port = 8644
#   force_https = true
#   auto_stop_machines = "off"
#   auto_start_machines = true
#   min_machines_running = 1
#
#   [http_service.concurrency]
#     type = "connections"
#     hard_limit = 100
#     soft_limit = 80

[mounts]
  source = "hermes_data"
  destination = "/opt/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
