# fly.toml app configuration file generated for very-hermes on 2026-04-20T22:32:57+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'very-hermes'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  HERMES_HOME = '/opt/data'
  # Hermes now multiplexes every profile (incl. "family") from ONE gateway on
  # the default profile. A separate `-p family` gateway just exits ("One gateway
  # per host serves every profile") and the supervisor restart-loops it, so run
  # only the default. Also set as a Fly secret, which takes precedence.
  HERMES_GATEWAY_PROFILES = 'default'

[processes]
  app = "/usr/local/bin/hermes-gateway-supervisor.sh"

# No [http_service] by default — Telegram, Discord, Slack, WhatsApp, and
# Signal are all outbound-only (long-poll or websocket out to the platform),
# so the machine doesn't need a public IP. If you want to receive inbound
# webhooks (GitHub, Stripe, etc.) or run Telegram in webhook mode, uncomment
# the block below and add the WEBHOOK_HOST / WEBHOOK_PORT env vars above.
#
# [http_service]
#   internal_port = 8644
#   force_https = true
#   auto_stop_machines = "off"
#   auto_start_machines = true
#   min_machines_running = 1
#
#   [http_service.concurrency]
#     type = "connections"
#     hard_limit = 100
#     soft_limit = 80

[[mounts]]
  source = 'hermes_data'
  destination = '/opt/data'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
